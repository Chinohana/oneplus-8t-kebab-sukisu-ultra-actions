name: Approve kernel candidate

run-name: Cloud approval of the current phone-tested candidate

on:
  workflow_dispatch:
    inputs:
      confirm_phone_test:
        description: I confirm the current candidate passed the complete phone test
        required: true
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  approve:
    name: Verify exact phone-tested candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Require the protected main copy of this workflow
        shell: bash
        env:
          CONFIRM_PHONE_TEST: ${{ inputs.confirm_phone_test }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM_PHONE_TEST" = true

      - name: Check out trusted verifier
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Resolve the unique open candidate and successful build
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          permission="$(
            gh api "repos/$repo/collaborators/$GITHUB_ACTOR/permission" \
              --jq .permission
          )"
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "::error::The operator does not have write permission."; exit 1 ;;
          esac

          gh api --method GET \
            "repos/$repo/actions/workflows/kernel-candidate.yml/runs?event=pull_request&per_page=100" \
            > "$RUNNER_TEMP/runs.json"
          gh api --method GET \
            "repos/$repo/pulls?state=open&base=main&per_page=100" \
            > "$RUNNER_TEMP/pulls.json"

          : > "$RUNNER_TEMP/candidates.tsv"
          while IFS=$'\t' read -r pr_number head_sha; do
            [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
            run_id="$(
              jq -r \
                --argjson pr "$pr_number" \
                --arg head "$head_sha" \
                '[.workflow_runs[]
                  | select(.conclusion == "success")
                  | select(.head_sha == $head)
                  | select(any(.pull_requests[]?; .number == $pr))]
                 | sort_by(.run_number) | last | .id // empty' \
                "$RUNNER_TEMP/runs.json"
            )"
            test -n "$run_id" || continue

            artifact_json="$RUNNER_TEMP/artifacts-$run_id.json"
            gh api "repos/$repo/actions/runs/$run_id/artifacts?per_page=100" \
              > "$artifact_json"
            artifact_id="$(
              jq -r \
                '[.artifacts[]
                  | select(.expired == false)
                  | select(.name | startswith("CANDIDATE_SukiSU_kebab_extended-full-hide_"))]
                 | if length == 1 then .[0].id else empty end' \
                "$artifact_json"
            )"
            test -n "$artifact_id" || continue
            printf '%s\t%s\t%s\t%s\n' \
              "$pr_number" "$head_sha" "$run_id" "$artifact_id" \
              >> "$RUNNER_TEMP/candidates.tsv"
          done < <(
            jq -r \
              --arg repo "$repo" \
              '.[]
               | select(.head.repo.full_name == $repo)
               | [.number, .head.sha] | @tsv' \
              "$RUNNER_TEMP/pulls.json"
          )

          candidate_count="$(wc -l < "$RUNNER_TEMP/candidates.tsv")"
          if test "$candidate_count" -ne 1; then
            echo "::error::Expected exactly one open, successfully built phone-test candidate; found $candidate_count."
            exit 1
          fi
          IFS=$'\t' read -r pr_number head_sha run_id artifact_id \
            < "$RUNNER_TEMP/candidates.tsv"

          gh api --method GET \
            "repos/$repo/actions/workflows/kernel-runtime-policy.yml/runs?event=pull_request&per_page=100" \
            > "$RUNNER_TEMP/policy-runs.json"
          policy_run_id="$(
            jq -r \
              --argjson pr "$pr_number" \
              --arg head "$head_sha" \
              '[.workflow_runs[]
                | select(.head_sha == $head)
                | select(any(.pull_requests[]?; .number == $pr))]
               | sort_by(.run_number) | last | .id // empty' \
              "$RUNNER_TEMP/policy-runs.json"
          )"
          test -n "$policy_run_id"

          {
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "run_id=$run_id"
            echo "artifact_id=$artifact_id"
            echo "policy_run_id=$policy_run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the exact PR head as untrusted data
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Download the exact candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.resolve.outputs.artifact_id }}
        run: |
          set -euo pipefail
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/candidate-artifact.zip"
          test -s "$RUNNER_TEMP/candidate-artifact.zip"

      - name: Verify package, source fingerprint and provenance without executing PR code
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted/.github/scripts/verify-runtime-approval.py \
            --candidate candidate \
            --artifact "$RUNNER_TEMP/candidate-artifact.zip" \
            --head-sha "${{ steps.resolve.outputs.head_sha }}" \
            --run-id "${{ steps.resolve.outputs.run_id }}" \
            --pr "${{ steps.resolve.outputs.pr_number }}" \
            --output "$RUNNER_TEMP/approval.json"

      - name: Record approval and rerun the exact-head runtime check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          POLICY_RUN_ID: ${{ steps.resolve.outputs.policy_run_id }}
        run: |
          set -euo pipefail
          approved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq \
            --arg actor "$GITHUB_ACTOR" \
            --arg approved_at "$approved_at" \
            '. + {operator:$actor, approved_at:$approved_at}' \
            "$RUNNER_TEMP/approval.json" > "$RUNNER_TEMP/approval-final.json"

          {
            echo '<!-- kernel-runtime-approval:v1 -->'
            echo 'Phone-test approval for this exact candidate:'
            echo
            echo '```json'
            jq . "$RUNNER_TEMP/approval-final.json"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -F body=@"$RUNNER_TEMP/comment.md"

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/runs/$POLICY_RUN_ID/rerun-failed-jobs"

          cat "$RUNNER_TEMP/approval-final.json" >> "$GITHUB_STEP_SUMMARY"
