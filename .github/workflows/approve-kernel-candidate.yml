name: Approve kernel candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-acceptance-entry:
    runs-on: ubuntu-24.04
    steps:
      - name: Show local acceptance entry
        run: |
          echo 'Candidate acceptance is performed locally.'
          echo 'Run: python3 scripts/release/local.py accept --help'
          echo 'Acceptance requires the exact local artifacts, local matrix and phone-test evidence.'
          echo 'This workflow does not approve or publish artifacts.'
