name: Build kebab LineageOS 23.2 SukiSU Ultra

on:
  workflow_dispatch:
    inputs:
      kernel_commit:
        description: "Exact LineageOS kernel commit"
        required: true
        default: "4238ee49a84b"
        type: string
      susfs:
        description: "Legacy SUSFS 1.5.5 (blocked with the current SukiSU 4.x baseline)"
        required: true
        default: false
        type: boolean
      kpm:
        description: "KPM (blocked pending a separately audited 4.19 backport)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: kebab-sukisu-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_REPOSITORY: https://github.com/LineageOS/android_kernel_oneplus_sm8250.git
  KERNEL_BRANCH: lineage-23.2
  KERNEL_DEFCONFIG: vendor/kona-perf_defconfig
  OPLUS_CONFIG: vendor/oplus.config
  EXPECTED_BASE_COMMIT: "4238ee49a84b"
  SUKISU_TAG: v4.1.3
  SUKISU_COMMIT: 0ca744a88835144c58d8256ebb32c279edabfcde
  CLANG_REVISION: clang-r563880
  CLANG_ARCHIVE_COMMIT: 6f88d37dd82ba741ca279539d44bb7da27ab1844
  ANYKERNEL_REPOSITORY: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    name: SM8250 4.19 / kebab
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check runner storage
        run: |
          set -euo pipefail
          df -h /
          test "$(df --output=avail -BG / | tail -n1 | tr -dc '0-9')" -ge 30

      - name: Check out builder sources
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "Chinohana"
          git config --global user.email "41898282+Chinohana@users.noreply.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git jq libelf-dev \
            libssl-dev lz4 python3 rsync unzip wget zip

      - name: Show selected inputs and runner state
        run: |
          set -eux
          echo "Kernel repository: $KERNEL_REPOSITORY"
          echo "Kernel branch: $KERNEL_BRANCH"
          echo "Kernel commit: ${{ inputs.kernel_commit }}"
          echo "Defconfig: $KERNEL_DEFCONFIG + $OPLUS_CONFIG"
          echo "SUSFS: ${{ inputs.susfs }}"
          echo "KPM: ${{ inputs.kpm }}"
          echo "Toolchain: $CLANG_REVISION"
          df -h
          free -h

      - name: Cache Android Clang r563880
        id: cache-clang
        uses: actions/cache/restore@v4
        with:
          path: toolchains/clang
          key: android-clang-r563880-linux-x86

      - name: Download Android Clang r563880
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchains/clang"
          curl -fL --retry 5 --retry-delay 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_ARCHIVE_COMMIT}/${CLANG_REVISION}.tar.gz" \
            | tar -xz -C "$GITHUB_WORKSPACE/toolchains/clang"

      - name: Verify Android Clang r563880
        run: |
          "$GITHUB_WORKSPACE/toolchains/clang/bin/clang" --version

      - name: Save Android Clang r563880 cache
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchains/clang
          key: android-clang-r563880-linux-x86

      - name: Initialize and sync exact LineageOS kernel
        run: |
          set -euo pipefail
          git init kernel_workspace
          cd kernel_workspace
          git remote add origin "$KERNEL_REPOSITORY"
          git fetch --depth=256 origin "refs/heads/$KERNEL_BRANCH"
          RESOLVED_COMMIT="$(git rev-parse --verify '${{ inputs.kernel_commit }}^{commit}')"
          git checkout --detach "$RESOLVED_COMMIT"
          test "$(git rev-parse --short=12 HEAD)" = "${{ inputs.kernel_commit }}"
          git log -1 --oneline

      - name: Force remove dirty suffix
        run: |
          set -euo pipefail
          cd kernel_workspace
          sed -i 's/ -dirty//g' scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' scripts/setlocalversion

      - name: Add pinned current SukiSU Ultra release driver
        run: |
          set -euo pipefail
          cd kernel_workspace
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "$SUKISU_COMMIT"
          test -d KernelSU
          test "$(git -C KernelSU rev-parse HEAD)" = "$SUKISU_COMMIT"
          test "$(git -C KernelSU rev-parse "$SUKISU_TAG^{commit}")" = "$SUKISU_COMMIT"
          MAIN_COUNT="$(git -C KernelSU rev-list --count main)"
          KSU_VERSION="$((40000 + MAIN_COUNT - 2815))"
          test "$KSU_VERSION" -ge 40000
          test "$KSU_VERSION" -lt 50000
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
          echo "SukiSU commit: $(git -C KernelSU rev-parse HEAD)"
          echo "SukiSU driver version: $KSU_VERSION"

      - name: Apply audited SukiSU v4.1.3 compatibility guards for Linux 4.19
        run: |
          set -euo pipefail
          git -C kernel_workspace/KernelSU apply --check \
            "$GITHUB_WORKSPACE/patches/sukisu-v4.1.3-linux-4.19.patch"
          git -C kernel_workspace/KernelSU apply \
            "$GITHUB_WORKSPACE/patches/sukisu-v4.1.3-linux-4.19.patch"
          git -C kernel_workspace/KernelSU diff --check
          git -C kernel_workspace/KernelSU diff --stat

      - name: Reject incompatible legacy SUSFS mix
        if: ${{ inputs.susfs }}
        run: |
          echo "::error::SUSFS kernel-4.19 is the legacy 1.5.5 interface and cannot be mixed with SukiSU 4.x."
          exit 1

      - name: Reject unaudited KPM 4.19 backport
        if: ${{ inputs.kpm }}
        run: |
          echo "::error::SukiSU v4.1.3 KPM uses the newer two-argument access_ok API and requires a separately audited 4.19 backport."
          exit 1

      - name: Add configuration settings
        run: |
          set -euo pipefail
          cd kernel_workspace
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 "$KERNEL_DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -O out \
            out/.config "arch/arm64/configs/$OPLUS_CONFIG"

          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e KPROBES
          scripts/config --file out/.config -e KALLSYMS
          scripts/config --file out/.config -e KALLSYMS_ALL

          if [ "${{ inputs.kpm }}" = "true" ]; then
            scripts/config --file out/.config -e KPM
          else
            scripts/config --file out/.config -d KPM
          fi

          if [ "${{ inputs.susfs }}" = "true" ]; then
            scripts/config --file out/.config -e KSU_SUSFS
            scripts/config --file out/.config -e KSU_SUSFS_HAS_MAGIC_MOUNT
            scripts/config --file out/.config -e KSU_SUSFS_SUS_PATH
            scripts/config --file out/.config -e KSU_SUSFS_SUS_MOUNT
            scripts/config --file out/.config -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
            scripts/config --file out/.config -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
            scripts/config --file out/.config -e KSU_SUSFS_SUS_KSTAT
            scripts/config --file out/.config -d KSU_SUSFS_SUS_OVERLAYFS
            scripts/config --file out/.config -e KSU_SUSFS_TRY_UMOUNT
            scripts/config --file out/.config -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
            scripts/config --file out/.config -e KSU_SUSFS_SPOOF_UNAME
            scripts/config --file out/.config -e KSU_SUSFS_ENABLE_LOG
            scripts/config --file out/.config -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            scripts/config --file out/.config -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            scripts/config --file out/.config -e KSU_SUSFS_OPEN_REDIRECT
          fi

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          grep -E \
            'CONFIG_(KSU|KPM|KPROBES|KALLSYMS|KALLSYMS_ALL|KSU_SUSFS)(=|_)' \
            out/.config | sort
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KPROBES=y$' out/.config
          grep -q '^CONFIG_KALLSYMS=y$' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config
          if [ "${{ inputs.kpm }}" = "true" ]; then
            grep -q '^CONFIG_KPM=y$' out/.config
          fi
          if [ "${{ inputs.susfs }}" = "true" ]; then
            grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          fi

      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel_workspace
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=github
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            Image
          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Apply KPM patch_linux
        if: ${{ inputs.kpm }}
        run: |
          set -euo pipefail
          cd kernel_workspace/out/arch/arm64/boot
          curl -fLSs \
            "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/main/kpm/patch_linux" \
            -o patch_linux
          chmod +x patch_linux
          ./patch_linux
          test -s oImage
          mv -f oImage Image
          rm -f patch_linux

      - name: Make AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 "$ANYKERNEL_REPOSITORY" AnyKernel3
          rm -rf AnyKernel3/.git
          cp kernel_workspace/out/arch/arm64/boot/Image AnyKernel3/Image

          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=kebab/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=OnePlus8T/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name3=.*/device.name3=KB2000/' AnyKernel3/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/by-name/boot;|' AnyKernel3/anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' AnyKernel3/anykernel.sh
          sed -i 's/^do.modules=.*/do.modules=0/' AnyKernel3/anykernel.sh

          grep -q '^BLOCK=/dev/block/by-name/boot;$' AnyKernel3/anykernel.sh
          grep -q '^IS_SLOT_DEVICE=1;$' AnyKernel3/anykernel.sh

          rm -f AnyKernel3/README.md
          PACKAGE_NAME="SukiSU-Ultra_kebab_LOS23.2_4.19_${{ inputs.kernel_commit }}_KSU${KSU_VERSION}"
          if [ "${{ inputs.susfs }}" = "true" ]; then
            PACKAGE_NAME="${PACKAGE_NAME}_SUSFS"
          fi
          if [ "${{ inputs.kpm }}" = "true" ]; then
            PACKAGE_NAME="${PACKAGE_NAME}_KPM"
          fi
          (
            cd AnyKernel3
            zip -r9 "../${PACKAGE_NAME}.zip" . \
              -x '.git/*' '*placeholder'
          )
          sha256sum "${PACKAGE_NAME}.zip" \
            | tee "${PACKAGE_NAME}.zip.sha256"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

      - name: Record build provenance
        run: |
          set -euo pipefail
          {
            echo "device=kebab"
            echo "model=OnePlus 8T"
            echo "rom=LineageOS 23.2"
            echo "kernel_repository=$KERNEL_REPOSITORY"
            echo "kernel_commit=$(git -C kernel_workspace rev-parse HEAD)"
            echo "sukisu_commit=$(git -C kernel_workspace/KernelSU rev-parse HEAD)"
            echo "susfs=${{ inputs.susfs }}"
            echo "kpm=${{ inputs.kpm }}"
            echo "clang=$("$GITHUB_WORKSPACE/toolchains/clang/bin/clang" --version | head -n1)"
            echo "package=${PACKAGE_NAME}.zip"
            cat "${PACKAGE_NAME}.zip.sha256"
          } | tee build-provenance.txt

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.zip.sha256
            build-provenance.txt
          if-no-files-found: error
          retention-days: 1
