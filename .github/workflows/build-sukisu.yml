name: Build kebab LineageOS 23.2 SukiSU Ultra

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kebab-sukisu-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_REPOSITORY: https://github.com/LineageOS/android_kernel_oneplus_sm8250.git
  KERNEL_BRANCH: lineage-23.2
  KERNEL_DEFCONFIG: vendor/kona-perf_defconfig
  OPLUS_CONFIG: vendor/oplus.config
  KERNEL_COMMIT: 4238ee49a84bd418c8515c297563bb29f95ab40b
  KERNEL_COMMIT_SHORT: "4238ee49a84b"
  SUKISU_BRANCH: builtin
  SUKISU_COMMIT: b1d534bc41941b2c818d7a1a1dac341e4aabfc2d
  CLANG_REVISION: clang-r563880
  CLANG_ARCHIVE_COMMIT: 6f88d37dd82ba741ca279539d44bb7da27ab1844
  ANYKERNEL_REPOSITORY: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_COMMIT: 1c9a500dd4aa8081952523126e97eb155aed941b

jobs:
  build:
    name: SM8250 4.19 / kebab
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check runner storage
        run: |
          set -euo pipefail
          df -h /
          test "$(df --output=avail -BG / | tail -n1 | tr -dc '0-9')" -ge 30

      - name: Check out builder sources
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "Chinohana"
          git config --global user.email "41898282+Chinohana@users.noreply.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git jq libelf-dev \
            libssl-dev lz4 python3 rsync unzip wget zip

      - name: Show selected inputs and runner state
        run: |
          set -eux
          echo "Kernel repository: $KERNEL_REPOSITORY"
          echo "Kernel branch: $KERNEL_BRANCH"
          echo "Kernel commit: $KERNEL_COMMIT"
          echo "Defconfig: $KERNEL_DEFCONFIG + $OPLUS_CONFIG"
          echo "SukiSU branch: $SUKISU_BRANCH"
          echo "SukiSU commit: $SUKISU_COMMIT"
          echo "Hook: manual"
          echo "SUSFS: n"
          echo "KPM: n"
          echo "Toolchain: $CLANG_REVISION"
          df -h
          free -h

      - name: Cache Android Clang r563880
        id: cache-clang
        uses: actions/cache/restore@v4
        with:
          path: toolchains/clang
          key: android-clang-r563880-linux-x86

      - name: Download Android Clang r563880
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchains/clang"
          curl -fL --retry 5 --retry-delay 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_ARCHIVE_COMMIT}/${CLANG_REVISION}.tar.gz" \
            | tar -xz -C "$GITHUB_WORKSPACE/toolchains/clang"

      - name: Verify Android Clang r563880
        run: |
          "$GITHUB_WORKSPACE/toolchains/clang/bin/clang" --version

      - name: Save Android Clang r563880 cache
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchains/clang
          key: android-clang-r563880-linux-x86

      - name: Initialize and sync exact LineageOS kernel
        run: |
          set -euo pipefail
          git init kernel_workspace
          cd kernel_workspace
          git remote add origin "$KERNEL_REPOSITORY"
          git fetch --depth=256 origin "refs/heads/$KERNEL_BRANCH"
          RESOLVED_COMMIT="$(git rev-parse --verify "$KERNEL_COMMIT^{commit}")"
          git checkout --detach "$RESOLVED_COMMIT"
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          test "$(git rev-parse --short=12 HEAD)" = "$KERNEL_COMMIT_SHORT"
          git log -1 --oneline

      - name: Force remove dirty suffix
        run: |
          set -euo pipefail
          cd kernel_workspace
          sed -i 's/ -dirty//g' scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' scripts/setlocalversion

      - name: Add pinned official SukiSU Ultra builtin driver
        run: |
          set -euo pipefail
          cd kernel_workspace
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/$SUKISU_COMMIT/kernel/setup.sh" \
            | bash -s "$SUKISU_COMMIT"
          test -d KernelSU
          test "$(git -C KernelSU rev-parse HEAD)" = "$SUKISU_COMMIT"
          test "$(git -C KernelSU rev-parse origin/$SUKISU_BRANCH)" = "$SUKISU_COMMIT"
          test "$(git -C KernelSU branch -r --contains HEAD | grep -c "origin/$SUKISU_BRANCH")" -ge 1
          MAIN_COUNT="$(git -C KernelSU rev-list --count main)"
          KSU_VERSION="$((40000 + MAIN_COUNT - 2815))"
          test "$KSU_VERSION" -ge 40000
          test "$KSU_VERSION" -lt 50000
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
          echo "SukiSU commit: $(git -C KernelSU rev-parse HEAD)"
          echo "SukiSU driver version: $KSU_VERSION"

      - name: Apply audited builtin compatibility guard for Linux 4.19
        run: |
          set -euo pipefail
          git -C kernel_workspace/KernelSU apply --check \
            "$GITHUB_WORKSPACE/patches/sukisu-builtin-b1-linux-4.19.patch"
          git -C kernel_workspace/KernelSU apply \
            "$GITHUB_WORKSPACE/patches/sukisu-builtin-b1-linux-4.19.patch"
          git -C kernel_workspace/KernelSU diff --check
          git -C kernel_workspace/KernelSU diff --stat

      - name: Apply pinned non-GKI manual hooks
        run: |
          set -euo pipefail
          cd kernel_workspace
          git apply --check \
            "$GITHUB_WORKSPACE/patches/sukisu-builtin-manual-hooks-sm8250-4.19.patch"
          git apply \
            "$GITHUB_WORKSPACE/patches/sukisu-builtin-manual-hooks-sm8250-4.19.patch"
          git diff --check
          git diff --stat
          test "$(git grep -c 'ksu_handle_execveat(&fd' -- fs/exec.c | cut -d: -f2)" = 1
          test "$(git grep -c 'ksu_handle_faccessat(&dfd' -- fs/open.c | cut -d: -f2)" = 1
          test "$(git grep -c 'ksu_handle_vfs_read(&file' -- fs/read_write.c | cut -d: -f2)" = 1
          test "$(git grep -c 'ksu_handle_stat(&dfd' -- fs/stat.c | cut -d: -f2)" = 1
          test "$(git grep -c 'ksu_handle_sys_reboot(magic1' -- kernel/reboot.c | cut -d: -f2)" = 1

      - name: Add configuration settings
        run: |
          set -euo pipefail
          cd kernel_workspace
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 "$KERNEL_DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -O out \
            out/.config "arch/arm64/configs/$OPLUS_CONFIG"

          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -d KPROBES
          scripts/config --file out/.config -d KPROBE_EVENTS
          scripts/config --file out/.config -d KPM
          scripts/config --file out/.config -d KSU_SUSFS
          scripts/config --file out/.config -e KALLSYMS
          scripts/config --file out/.config -e KALLSYMS_ALL

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          grep -E \
            'CONFIG_(KSU|KPM|KPROBES|KALLSYMS|KALLSYMS_ALL|KSU_SUSFS)(=|_)' \
            out/.config | sort
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KALLSYMS=y$' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config
          grep -q '^# CONFIG_KPROBES is not set$' out/.config
          grep -q '^# CONFIG_KPM is not set$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS is not set$' out/.config
          if grep -Eq \
            '^CONFIG_(KPROBES|KPROBE_EVENTS|KPM|KSU_SUSFS(|_.*))=y$' \
            out/.config; then
            echo "::error::Unsafe kprobe, KPM, or SUSFS option was re-enabled."
            exit 1
          fi

      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel_workspace
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=github
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            Image
          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          grep -q ' kernelsu_init$' out/System.map
          grep -q ' ksu_handle_execveat$' out/System.map
          grep -q ' ksu_handle_faccessat$' out/System.map
          grep -q ' ksu_handle_vfs_read$' out/System.map
          grep -q ' ksu_handle_stat$' out/System.map
          grep -q ' ksu_handle_sys_reboot$' out/System.map
          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Make AnyKernel3
        run: |
          set -euo pipefail
          git init AnyKernel3
          git -C AnyKernel3 remote add origin "$ANYKERNEL_REPOSITORY"
          git -C AnyKernel3 fetch --depth=1 origin "$ANYKERNEL_COMMIT"
          git -C AnyKernel3 checkout --detach "$ANYKERNEL_COMMIT"
          test "$(git -C AnyKernel3 rev-parse HEAD)" = "$ANYKERNEL_COMMIT"
          rm -rf AnyKernel3/.git
          cp kernel_workspace/out/arch/arm64/boot/Image AnyKernel3/Image

          sed -i \
            "s/^kernel.string=.*/kernel.string=SukiSU Ultra kebab manual KSU${KSU_VERSION}/" \
            AnyKernel3/anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=OnePlus8T/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=KB2000/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name3=.*/device.name3=kebab/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name4=.*/device.name4=/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name5=.*/device.name5=/' AnyKernel3/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/by-name/boot;|' AnyKernel3/anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' AnyKernel3/anykernel.sh
          sed -i 's/^do.modules=.*/do.modules=0/' AnyKernel3/anykernel.sh
          sed -i \
            '/^# init\.rc$/,/^append_file fstab\.tuna "usbdisk" fstab;$/d' \
            AnyKernel3/anykernel.sh
          sed -i 's/^dump_boot;.*/split_boot;/' AnyKernel3/anykernel.sh
          sed -i 's/^write_boot;.*/flash_boot;/' AnyKernel3/anykernel.sh

          grep -q "^kernel.string=SukiSU Ultra kebab manual KSU${KSU_VERSION}$" \
            AnyKernel3/anykernel.sh
          grep -q '^device.name1=OnePlus8T$' AnyKernel3/anykernel.sh
          grep -q '^device.name2=KB2000$' AnyKernel3/anykernel.sh
          grep -q '^device.name3=kebab$' AnyKernel3/anykernel.sh
          grep -q '^device.name4=$' AnyKernel3/anykernel.sh
          grep -q '^device.name5=$' AnyKernel3/anykernel.sh
          grep -q '^BLOCK=/dev/block/by-name/boot;$' AnyKernel3/anykernel.sh
          grep -q '^IS_SLOT_DEVICE=1;$' AnyKernel3/anykernel.sh
          test "$(grep -c '^split_boot;' AnyKernel3/anykernel.sh)" = 1
          test "$(grep -c '^flash_boot;' AnyKernel3/anykernel.sh)" = 1
          if grep -Eq \
            '^(dump_boot|write_boot|backup_file|replace_string|insert_line|append_file|patch_fstab);?' \
            AnyKernel3/anykernel.sh; then
            echo "::error::Unexpected ramdisk modification command remains in AnyKernel3."
            exit 1
          fi
          if grep -Eq '(^|[./])tuna([./;]|$)|device.name[45]=.+' AnyKernel3/anykernel.sh; then
            echo "::error::Example-device content remains in AnyKernel3."
            exit 1
          fi

          rm -f AnyKernel3/README.md
          PACKAGE_NAME="SukiSU-Ultra_kebab_LOS23.2_4.19_${KERNEL_COMMIT_SHORT}_KSU${KSU_VERSION}_builtin_manual"
          (
            cd AnyKernel3
            zip -r9 "../${PACKAGE_NAME}.zip" . \
              -x '.git/*' '*placeholder'
          )
          sha256sum "${PACKAGE_NAME}.zip" \
            | tee "${PACKAGE_NAME}.zip.sha256"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

      - name: Record build provenance
        run: |
          set -euo pipefail
          {
            echo "device=kebab"
            echo "model=OnePlus 8T"
            echo "rom=LineageOS 23.2"
            echo "kernel_repository=$KERNEL_REPOSITORY"
            echo "kernel_commit=$(git -C kernel_workspace rev-parse HEAD)"
            echo "sukisu_commit=$(git -C kernel_workspace/KernelSU rev-parse HEAD)"
            echo "sukisu_branch=$SUKISU_BRANCH"
            echo "hook=manual"
            echo "susfs=n"
            echo "kpm=n"
            echo "anykernel_commit=$ANYKERNEL_COMMIT"
            echo "clang=$("$GITHUB_WORKSPACE/toolchains/clang/bin/clang" --version | head -n1)"
            echo "package=${PACKAGE_NAME}.zip"
            cat "${PACKAGE_NAME}.zip.sha256"
          } | tee build-provenance.txt

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.zip.sha256
            build-provenance.txt
          if-no-files-found: error
          retention-days: 1
