name: Control script tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-approval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test trusted platform approval and fingerprint parity
        run: python3 scripts/test-platform-approval.py
      - name: Test local preflight, delivery integrity and comparison
        run: python3 scripts/test-local-build.py
      - name: Test local acceptance and phone-test evidence
        run: python3 scripts/test-local-release.py
      - name: Test single-configuration compilation policy
        run: python3 scripts/test-selected-build.py
      - name: Test incremental source and object cache isolation
        run: python3 scripts/test-incremental-build.py
