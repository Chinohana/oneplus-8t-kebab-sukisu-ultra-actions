name: Kernel runtime policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  kernel-runtime-policy:
    name: kernel-runtime-policy
    runs-on: ubuntu-24.04
    steps:
      - name: Record local acceptance policy
        run: |
          echo 'Runtime acceptance and release approval are local operations.'
          echo 'Before release, run the local matrix and record phone-test evidence for the exact package hash.'
          echo 'Passing this PR check is not artifact approval. See docs/LOCAL-BUILD.md.'
