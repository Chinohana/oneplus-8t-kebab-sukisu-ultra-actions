name: Kernel runtime policy

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  kernel-runtime-policy:
    name: kernel-runtime-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pass documents; require a fresh phone test for build changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          requires_phone_test=false
          while IFS= read -r file; do
            case "$file" in
              .gitmodules|config/*|pins/kernel-lineage-23.2|\
              .github/workflows/build-sukisu-ultra.yml|.github/scripts/*.sh|patches/*.patch)
                requires_phone_test=true
                ;;
            esac
          done < <(
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}"...HEAD
          )

          if test "$requires_phone_test" = true; then
            base_pin="$(
              git ls-tree "${{ github.event.pull_request.base.sha }}" -- \
                pins/kernel-lineage-23.2
            )"
            current_pin="$(
              git ls-tree HEAD -- pins/kernel-lineage-23.2 | awk '{print $3}'
            )"
            if test -z "$base_pin" &&
               test "$current_pin" = 4238ee49a84bd418c8515c297563bb29f95ab40b; then
              echo "Initial safety-flow migration: kernel-candidate-gate will require exact Image/config/System.map equivalence."
              exit 0
            fi

            gh api \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              > "$RUNNER_TEMP/comments.json"
            approved_count="$(
              jq \
                --arg head "$HEAD_SHA" \
                '[.[]
                  | select(.user.login == "github-actions[bot]")
                  | .body
                  | try (
                      capture("(?s)```json\\n(?<json>\\{.*?\\})\\n```").json
                      | fromjson
                    ) catch empty
                  | select(.schema == 1)
                  | select(.result == "passed")
                  | select(.head_sha == $head)]
                 | length' \
                "$RUNNER_TEMP/comments.json"
            )"
            if test "$approved_count" -lt 1; then
              echo "::error::This exact candidate still needs the manual phone-test approval."
              echo "Run the 'Approve kernel candidate' workflow after testing the CANDIDATE package."
              exit 1
            fi
            echo "A phone-test approval exists for this exact PR head."
            exit 0
          fi

          echo "No kernel build input changed; phone testing is not required."
