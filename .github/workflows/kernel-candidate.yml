name: Kernel candidate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: kernel-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect pinned LineageOS kernel
    runs-on: ubuntu-24.04
    outputs:
      needs_build: ${{ steps.inspect.outputs.needs_build }}
      kernel_changed: ${{ steps.inspect.outputs.kernel_changed }}
      platform_changed: ${{ steps.inspect.outputs.platform_changed }}
      old_kernel: ${{ steps.inspect.outputs.old_kernel }}
      new_kernel: ${{ steps.inspect.outputs.new_kernel }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify direction, branch and exact upstream tip
        id: inspect
        shell: bash
        run: |
          bash .github/scripts/validate-kernel-candidate.sh \
            "$GITHUB_WORKSPACE" \
            "${{ github.event.pull_request.base.sha }}"

      - name: Compute the phone-test fingerprint
        id: fingerprint
        if: steps.inspect.outputs.needs_build == 'true'
        shell: bash
        env:
          ENABLE_SUSFS: "true"
          SUSFS_PROFILE: extended-full
          ENABLE_SELINUX_HIDE: "true"
          USE_ANYKERNEL: "true"
          BUILD_CHANNEL: candidate
        run: |
          set -euo pipefail
          fingerprint="$(
            bash .github/scripts/compute-build-fingerprint.sh \
              "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/candidate-audit"
          )"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

  kernel-candidate-gate:
    name: kernel-candidate-gate
    needs: inspect
    runs-on: ubuntu-24.04
    steps:
      - name: Record source inspection result
        run: |
          echo 'Source inspection passed. Build and runtime acceptance are performed locally.'
          echo 'This lightweight check does not approve a kernel image.'
