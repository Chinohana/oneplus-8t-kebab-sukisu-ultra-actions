name: Build kebab SukiSU Ultra

run-name: ${{ inputs.kernel_source == 'latest-lineage-24.0' && 'UNAPPROVED_LATEST LineageOS 24.0 build' || 'Build kebab SukiSU Ultra' }}

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      enable_susfs:
        required: true
        type: boolean
      susfs_profile:
        required: true
        type: string
      enable_selinux_hide:
        required: true
        type: boolean
      use_anykernel:
        required: true
        type: boolean
      use_ccache:
        required: true
        type: boolean
      build_channel:
        required: false
        type: string
        default: candidate
      base_kernel_commit:
        required: false
        type: string
        default: ""
      kernel_source:
        required: false
        type: string
        default: approved-pin
  workflow_dispatch:
    inputs:
      enable_susfs:
        description: Include SUSFS v2.3 kernel support
        required: true
        type: boolean
        default: true
      susfs_profile:
        description: Audited SUSFS feature profile (used when SUSFS is enabled)
        required: true
        type: choice
        default: extended-full
        options:
          - smoke
          - minimal-mount
          - extended-stat
          - extended-full
      enable_selinux_hide:
        description: Include SELinux modification hiding (Linux 4.19 backport)
        required: true
        type: boolean
        default: true
      use_anykernel:
        description: "Package with AnyKernel3 ZIP (off: raw Image/System.map/config artifact)"
        required: true
        type: boolean
        default: true
      use_ccache:
        description: "Cache compiler output with ccache (off: previous non-cached build path)"
        required: false
        type: boolean
        default: true
      kernel_source:
        description: "Kernel source: approved bookmark, or latest LineageOS 24.0 at run time"
        required: true
        type: choice
        default: approved-pin
        options:
          - approved-pin
          - latest-lineage-24.0

permissions:
  contents: read

concurrency:
  group: kebab-ultra-${{ github.ref }}-${{ inputs.enable_susfs }}-${{ inputs.susfs_profile || 'extended-full' }}-${{ inputs.enable_selinux_hide }}-${{ inputs.use_anykernel }}-${{ inputs.build_channel || 'approved' }}
  cancel-in-progress: false

env:
  ENABLE_SUSFS: ${{ github.event_name == 'push' || inputs.enable_susfs }}
  SUSFS_PROFILE: ${{ inputs.susfs_profile || 'extended-full' }}
  ENABLE_SELINUX_HIDE: ${{ github.event_name == 'push' || inputs.enable_selinux_hide }}
  USE_ANYKERNEL: ${{ github.event_name == 'push' || inputs.use_anykernel }}
  USE_CCACHE: ${{ github.event_name == 'push' || inputs.use_ccache }}
  BUILD_CHANNEL: ${{ inputs.build_channel || (github.ref == 'refs/heads/main' && 'approved' || 'candidate') }}
  BASE_KERNEL_COMMIT: ${{ inputs.base_kernel_commit || '' }}
  KERNEL_SOURCE_MODE: ${{ inputs.kernel_source || 'approved-pin' }}

jobs:
  audit-build:
    name: kebab SM8250 4.19
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/experiment/lineage-24.0')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PROFILE: ${{ inputs.susfs_profile || 'extended-full' }}

    steps:
      - name: Check out canonical SUSFS builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Load immutable pins and resolve the LineageOS 24.0 kernel
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/load-build-pins.sh "$GITHUB_WORKSPACE"
          pinned_kernel="$(
            bash .github/scripts/resolve-kernel-pin.sh "$GITHUB_WORKSPACE" |
              tail -n1
          )"
          case "$KERNEL_SOURCE_MODE" in
            approved-pin) ;;
            latest-lineage-24.0)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              latest_kernel="$(
                git ls-remote "$KERNEL_REPOSITORY" \
                  "refs/heads/$KERNEL_BRANCH" |
                  awk 'NR == 1 {print $1}'
              )"
              [[ "$latest_kernel" =~ ^[0-9a-f]{40}$ ]]

              upstream="$RUNNER_TEMP/lineage-kernel-history"
              git init --bare "$upstream"
              git -C "$upstream" remote add origin "$KERNEL_REPOSITORY"
              git -C "$upstream" fetch --no-tags --filter=blob:none origin \
                "+refs/heads/$KERNEL_BRANCH:refs/remotes/origin/$KERNEL_BRANCH"
              test "$(
                git -C "$upstream" rev-parse \
                  "refs/remotes/origin/$KERNEL_BRANCH"
              )" = "$latest_kernel"
              git -C "$upstream" merge-base --is-ancestor \
                "$pinned_kernel" "$latest_kernel"

              {
                echo "KERNEL_COMMIT_OVERRIDE=$latest_kernel"
                echo "KERNEL_COMMIT=$latest_kernel"
                echo "BASE_KERNEL_COMMIT=$pinned_kernel"
                echo "BUILD_CHANNEL=unapproved_latest"
              } >> "$GITHUB_ENV"
              export KERNEL_COMMIT_OVERRIDE="$latest_kernel"
              ;;
            *)
              echo "::error::Unknown kernel source mode: $KERNEL_SOURCE_MODE"
              exit 1
              ;;
          esac
          bash .github/scripts/resolve-kernel-pin.sh "$GITHUB_WORKSPACE"
          test "$KERNEL_BRANCH" = lineage-24.0

      - name: Enforce branch and immutable legacy baseline
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_CHANNEL" in
            approved)
              test "$GITHUB_REF" = "refs/heads/$CANONICAL_BRANCH"
              test "$KERNEL_SOURCE_MODE" = approved-pin
              ;;
            candidate)
              test "$KERNEL_SOURCE_MODE" = approved-pin
              ;;
            unapproved_latest)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "$KERNEL_SOURCE_MODE" = latest-lineage-24.0
              ;;
            *)
              echo "::error::Unknown build channel: $BUILD_CHANNEL"
              exit 1
              ;;
          esac
          if test "$ENABLE_SUSFS" = "true"; then
            case "$PROFILE" in
              smoke|minimal-mount|extended-stat|extended-full) ;;
              *)
                echo "::error::Unknown SUSFS profile: $PROFILE"
                exit 1
                ;;
            esac
          fi

          bash scripts/build/run-stage.sh baseline-identity

          if test "$ENABLE_SUSFS" = "true"; then
            test -s "$SUSFS_PATCH"
            test -s "$SUSFS_SUKISU_42_COMPAT_PATCH"
          fi
          test -s "$SUKISU_COMPAT_PATCH"
          test -s "$BASELINE_HOOK_PATCH"
          test -s "$REPRODUCIBLE_KHEADERS_PATCH"
          if test "$ENABLE_SELINUX_HIDE" = "true"; then
            test -s "$SELINUX_HIDE_SUKISU_PATCH"
            test -s "$SELINUX_HIDE_KERNEL_PATCH"
          fi

      - name: Compute the exact build fingerprint
        shell: bash
        run: |
          bash scripts/build/run-stage.sh fingerprint

      - name: Check runner storage
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          available_gb="$(
            df --output=avail -BG / | tail -n1 | tr -dc '0-9'
          )"
          test "$available_gb" -ge 35

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "Chinohana"
          git config --global user.email \
            "41898282+Chinohana@users.noreply.github.com"

      - name: Install build and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl file flex git jq libelf-dev \
            libssl-dev lz4 ninja-build python3 rsync unzip wget zip

      - name: Cache Android Clang r563880
        id: cache-clang
        uses: actions/cache/restore@v4
        with:
          path: toolchains/clang
          key: android-clang-r563880-linux-x86

      - name: Download exact Android Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchains/clang"
          curl --fail --location --show-error --silent \
            --retry 5 --retry-delay 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_ARCHIVE_COMMIT}/${CLANG_REVISION}.tar.gz" \
            | tar -xz -C "$GITHUB_WORKSPACE/toolchains/clang"

      - name: Verify and cache Android Clang
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/toolchains/clang/bin/clang" --version
          test -x "$GITHUB_WORKSPACE/toolchains/clang/bin/ld.lld"
          test -x "$GITHUB_WORKSPACE/toolchains/clang/bin/llvm-nm"

      - name: Save Android Clang cache
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchains/clang
          key: android-clang-r563880-linux-x86

      - name: Fetch exact SUSFS and SM8250 references
        if: ${{ env.ENABLE_SUSFS == 'true' }}
        shell: bash
        run: |
          bash scripts/build/run-stage.sh references

      - name: Preflight exact patch file allowlists
        shell: bash
        run: |
          bash scripts/build/run-stage.sh patch-preflight

      - name: Prepare exact common kernel and SukiSU source
        shell: bash
        run: |
          bash scripts/build/run-stage.sh source

      - name: Apply baseline and experimental patches exactly
        shell: bash
        run: |
          bash scripts/build/run-stage.sh patches

      - name: Audit Linux 4.19 SELinux hide backport
        if: ${{ env.ENABLE_SELINUX_HIDE == 'true' }}
        shell: bash
        run: |
          bash scripts/build/run-stage.sh audit-hide

      - name: Audit v2.3 source identity and minimal adaptations
        if: ${{ env.ENABLE_SUSFS == 'true' }}
        shell: bash
        run: |
          bash scripts/build/run-stage.sh audit-susfs

      - name: Audit manual entry hooks and pathname ABI
        shell: bash
        run: |
          bash scripts/build/run-stage.sh audit-hooks

      - name: Configure baseline, smoke, and selected profile
        shell: bash
        run: |
          bash scripts/build/run-stage.sh configure

      - name: Restore baseline ccache
        id: cache-ccache-baseline
        if: ${{ env.USE_CCACHE == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .ccache/baseline
          key: ccache-kebab-v3-${{ env.CLANG_REVISION }}-baseline-${{ env.CCACHE_SOURCE_FINGERPRINT }}
          restore-keys: |
            ccache-kebab-v3-${{ env.CLANG_REVISION }}-baseline-

      - name: Restore selected ccache
        id: cache-ccache-selected
        if: ${{ env.USE_CCACHE == 'true' && env.ENABLE_SUSFS != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .ccache/selected-${{ env.CCACHE_HIDE_TAG }}
          key: ccache-kebab-v3-${{ env.CLANG_REVISION }}-selected-${{ env.CCACHE_HIDE_TAG }}-${{ env.CCACHE_SOURCE_FINGERPRINT }}
          restore-keys: |
            ccache-kebab-v3-${{ env.CLANG_REVISION }}-selected-${{ env.CCACHE_HIDE_TAG }}-

      - name: Restore smoke ccache
        id: cache-ccache-smoke
        if: ${{ env.USE_CCACHE == 'true' && env.ENABLE_SUSFS == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .ccache/smoke-${{ env.CCACHE_HIDE_TAG }}
          key: ccache-kebab-v3-${{ env.CLANG_REVISION }}-smoke-${{ env.CCACHE_HIDE_TAG }}-${{ env.CCACHE_SOURCE_FINGERPRINT }}
          restore-keys: |
            ccache-kebab-v3-${{ env.CLANG_REVISION }}-smoke-${{ env.CCACHE_HIDE_TAG }}-

      - name: Restore minimal-mount ccache
        id: cache-ccache-minimal
        if: ${{ env.USE_CCACHE == 'true' && env.ENABLE_SUSFS == 'true' && env.PROFILE != 'smoke' }}
        uses: actions/cache/restore@v4
        with:
          path: .ccache/minimal-mount-${{ env.CCACHE_HIDE_TAG }}
          key: ccache-kebab-v3-${{ env.CLANG_REVISION }}-minimal-mount-${{ env.CCACHE_HIDE_TAG }}-${{ env.CCACHE_SOURCE_FINGERPRINT }}
          restore-keys: |
            ccache-kebab-v3-${{ env.CLANG_REVISION }}-minimal-mount-${{ env.CCACHE_HIDE_TAG }}-

      - name: Restore extended-stat ccache
        id: cache-ccache-extended-stat
        if: ${{ env.USE_CCACHE == 'true' && env.ENABLE_SUSFS == 'true' && env.PROFILE == 'extended-stat' }}
        uses: actions/cache/restore@v4
        with:
          path: .ccache/extended-stat-${{ env.CCACHE_HIDE_TAG }}
          key: ccache-kebab-v3-${{ env.CLANG_REVISION }}-extended-stat-${{ env.CCACHE_HIDE_TAG }}-${{ env.CCACHE_SOURCE_FINGERPRINT }}
          restore-keys: |
            ccache-kebab-v3-${{ env.CLANG_REVISION }}-extended-stat-${{ env.CCACHE_HIDE_TAG }}-

      - name: Restore extended-full ccache
        id: cache-ccache-extended-full
        if: ${{ env.USE_CCACHE == 'true' && env.ENABLE_SUSFS == 'true' && env.PROFILE == 'extended-full' }}
        uses: actions/cache/restore@v4
        with:
          path: .ccache/extended-full-${{ env.CCACHE_HIDE_TAG }}
          key: ccache-kebab-v3-${{ env.CLANG_REVISION }}-extended-full-${{ env.CCACHE_HIDE_TAG }}-${{ env.CCACHE_SOURCE_FINGERPRINT }}
          restore-keys: |
            ccache-kebab-v3-${{ env.CLANG_REVISION }}-extended-full-${{ env.CCACHE_HIDE_TAG }}-

      - name: Configure stage-scoped ccache
        if: ${{ env.USE_CCACHE == 'true' }}
        shell: bash
        run: |
          bash scripts/build/run-stage.sh cache-configure

      - name: Record ccache restore provenance
        if: ${{ env.USE_CCACHE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "schema=ccache-v3"
            echo "source_fingerprint=$CCACHE_SOURCE_FINGERPRINT"
            echo "baseline_hit=${{ steps.cache-ccache-baseline.outputs.cache-hit }}"
            echo "baseline_matched_key=${{ steps.cache-ccache-baseline.outputs.cache-matched-key }}"
            echo "selected_hit=${{ steps.cache-ccache-selected.outputs.cache-hit }}"
            echo "selected_matched_key=${{ steps.cache-ccache-selected.outputs.cache-matched-key }}"
            echo "smoke_hit=${{ steps.cache-ccache-smoke.outputs.cache-hit }}"
            echo "smoke_matched_key=${{ steps.cache-ccache-smoke.outputs.cache-matched-key }}"
            echo "minimal_hit=${{ steps.cache-ccache-minimal.outputs.cache-hit }}"
            echo "minimal_matched_key=${{ steps.cache-ccache-minimal.outputs.cache-matched-key }}"
            echo "extended_stat_hit=${{ steps.cache-ccache-extended-stat.outputs.cache-hit }}"
            echo "extended_stat_matched_key=${{ steps.cache-ccache-extended-stat.outputs.cache-matched-key }}"
            echo "extended_full_hit=${{ steps.cache-ccache-extended-full.outputs.cache-hit }}"
            echo "extended_full_matched_key=${{ steps.cache-ccache-extended-full.outputs.cache-matched-key }}"
          } > audit/ccache-restore.txt

      - name: Build baseline, smoke, and selected profile
        shell: bash
        run: |
          bash scripts/build/run-stage.sh compile

      - name: Record ccache statistics
        if: ${{ env.USE_CCACHE == 'true' }}
        shell: bash
        run: |
          bash scripts/build/run-stage.sh cache-stats

      - name: Save baseline ccache
        if: >-
          ${{ env.USE_CCACHE == 'true' &&
              steps.cache-ccache-baseline.outputs.cache-hit != 'true' &&
              (github.event_name != 'pull_request' ||
               (env.ENABLE_SUSFS != 'true' && env.ENABLE_SELINUX_HIDE != 'true')) }}
        uses: actions/cache/save@v4
        with:
          path: .ccache/baseline
          key: ${{ steps.cache-ccache-baseline.outputs.cache-primary-key }}

      - name: Save selected ccache
        if: ${{ env.USE_CCACHE == 'true' && env.ENABLE_SUSFS != 'true' && steps.cache-ccache-selected.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache/selected-${{ env.CCACHE_HIDE_TAG }}
          key: ${{ steps.cache-ccache-selected.outputs.cache-primary-key }}

      - name: Save smoke ccache
        if: ${{ env.USE_CCACHE == 'true' && env.ENABLE_SUSFS == 'true' && steps.cache-ccache-smoke.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache/smoke-${{ env.CCACHE_HIDE_TAG }}
          key: ${{ steps.cache-ccache-smoke.outputs.cache-primary-key }}

      - name: Save minimal-mount ccache
        if: ${{ env.USE_CCACHE == 'true' && env.ENABLE_SUSFS == 'true' && env.PROFILE != 'smoke' && steps.cache-ccache-minimal.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache/minimal-mount-${{ env.CCACHE_HIDE_TAG }}
          key: ${{ steps.cache-ccache-minimal.outputs.cache-primary-key }}

      - name: Save extended-stat ccache
        if: ${{ env.USE_CCACHE == 'true' && env.ENABLE_SUSFS == 'true' && env.PROFILE == 'extended-stat' && steps.cache-ccache-extended-stat.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache/extended-stat-${{ env.CCACHE_HIDE_TAG }}
          key: ${{ steps.cache-ccache-extended-stat.outputs.cache-primary-key }}

      - name: Save extended-full ccache
        if: ${{ env.USE_CCACHE == 'true' && env.ENABLE_SUSFS == 'true' && env.PROFILE == 'extended-full' && steps.cache-ccache-extended-full.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache/extended-full-${{ env.CCACHE_HIDE_TAG }}
          key: ${{ steps.cache-ccache-extended-full.outputs.cache-primary-key }}

      - name: Audit warnings, symbols, configuration, and Image growth
        shell: bash
        run: |
          bash scripts/build/run-stage.sh audit-build

      - name: Build pinned official v2.3 userspace test tool
        if: ${{ env.ENABLE_SUSFS == 'true' }}
        shell: bash
        run: |
          bash scripts/build/run-stage.sh tool

      - name: Make audited AnyKernel3 package
        if: ${{ env.USE_ANYKERNEL == 'true' }}
        shell: bash
        run: |
          bash scripts/build/run-stage.sh package

      - name: Prepare raw kernel artifact without AnyKernel3
        if: ${{ env.USE_ANYKERNEL != 'true' }}
        shell: bash
        run: |
          bash scripts/build/run-stage.sh raw

      - name: Record provenance and assemble audit artifacts
        shell: bash
        run: |
          bash scripts/build/run-stage.sh provenance

      - name: Upload kernel package and audit
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ARTIFACT_NAME }}
          path: artifacts/kernel
          if-no-files-found: error
          retention-days: ${{ env.BUILD_CHANNEL == 'approved' && 7 || 30 }}

      - name: Upload pinned v2.3 userspace test tool
        if: ${{ env.ENABLE_SUSFS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_ARTIFACT_NAME }}
          path: artifacts/tool
          if-no-files-found: error
          retention-days: ${{ env.BUILD_CHANNEL == 'approved' && 7 || 30 }}
